name: Publicar demo jugable
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Leer la distribución fijada
        run: |
          python - <<'PY'
          import json, os, re
          config = json.load(open('deployment.json', encoding='utf-8'))
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]*', config['tag']), 'Tag inválido'
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]*\.zip', config['asset']), 'Asset inválido'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CONVOY_TAG=' + config['tag'] + '\n')
              env.write('CONVOY_ASSET=' + config['asset'] + '\n')
          PY
      - name: Descargar la versión publicada
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$CONVOY_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$CONVOY_ASSET" --dir package
      - name: Verificar y montar el sitio
        run: python .github/scripts/verificar_distribucion.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
